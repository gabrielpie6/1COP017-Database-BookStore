<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
    <div th:switch="${customers}">
        <h2 th:case="null">Ainda não há clientes!</h2>
        <div th:case="*">
            <h2>Clientes Cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>CPF</th>
                        <th>Nome</th>
                        <th>Sobrenome</th>
                        <th>Email</th>
                        <th>CEP</th>
                        <th>Rua</th>
                        <th>Número</th>
                        <th>Editar</th>
                        <th>Remover</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="customer : ${customers}">
                        <td th:text="${customer.cpf}"></td>
                        <td th:text="${customer.fname}"></td>
                        <td th:text="${customer.lname}"></td>
                        <td th:text="${customer.email}"></td>
                        <td th:text="${customer.CEP}"></td>
                        <td th:text="${customer.address_street}"></td>
                        <td th:text="${customer.address_number}"></td>
                        <td><a th:href="@{/edit-customer/{cpf}(cpf=${customer.cpf})}">Editar</a></td>
                        <td><a th:href="@{/remove-customer/{cpf}(cpf=${customer.cpf})}">Remover</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <p><a href="/new-customer">Adicionar um novo cliente</a></p>
    </div>
</body>
</html>
