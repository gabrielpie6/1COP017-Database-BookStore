<div th:switch="${publishers}">
    <h2 th:case="null">Ainda não há editoras!</h2>
    <div th:case="*">
        <h2>Editoras Cadastradas</h2>
        <table>
            <thead>
            <tr>
                <th>Nome</th>
                <th>Cidade</th>
                <th>Livros publicados</th>
                <th>Revistas publicadas</th>
                <th>Editar</th>
                <th>Remover</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="publisher : ${publishers}">
                <td th:text="${publisher.name}"></td>
                <td th:text="${publisher.city}"></td>
                <td th:text="${booksCounts.get(publishers.indexOf(publisher))}"></td>
                <td th:text="${magazinesCounts.get(publishers.indexOf(publisher))}"></td>
                <td><a th:href="@{/edit-publisher/{id}(id=${publisher.name})}">Editar</a></td>
                <td><a th:href="@{/remove-publisher/{id}(id=${publisher.name})}">Remover</a></td>
            </tr>
            </tbody>
        </table>
    </div>
    <p><a href="/new-publisher">Adicionar uma nova editora</a></p>
</div>
